<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بيانات العميل | مكتب مساعد</title>
  <link rel="stylesheet" href="customer.css">
</head>
<body>
  <main class="app">
    <section class="content">
      <header class="heading">
        <div class="mark">م</div>
        <h1><span>مرحبًا بك</span></h1>
        <p>يرجى إدخال معلوماتك للمتابعة</p>
      </header>
      <form class="form" id="customer-form">
        <input type="text" placeholder="الاسم الكامل" autocomplete="name" required>
        <input type="text" placeholder="العنوان" autocomplete="street-address" required>
        <input type="text" placeholder="رقم الشقة" required>
        <input type="tel" placeholder="رقم الجوال" autocomplete="tel" inputmode="tel" required>
        <label class="confirm"><input type="checkbox" required> أقر بأن البيانات المعينة دقيقة وصحيحة</label>
        <button type="submit">استمرار</button>
      </form>
    </section>
  </main>
  <script src="draft-sync.js"></script>
  <script>
    document.querySelector('#customer-form').addEventListener('submit', event => {
      event.preventDefault();
      const values = [...event.currentTarget.querySelectorAll('input')];
      const draft = JSON.parse(localStorage.getItem('musaedDraft') || '{}');
      draft.customerName = values[0].value;
      draft.address = values[1].value;
      draft.apartment = values[2].value;
      draft.phone = values[3].value;
      localStorage.setItem('musaedDraft', JSON.stringify(draft));
      window.location.href = 'payment.html';
    });
  </script>
</body>
</html>
