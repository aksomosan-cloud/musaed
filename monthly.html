<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>خدمة الشهر | مكتب مساعد</title>
    <link rel="stylesheet" href="booking.css">
</head>

<body>
    <main class="app">
        <header class="bar">
            <h1>طلب خدمة الشهر</h1><a class="close" href="index.html" aria-label="الرئيسية">×</a>
        </header>
        <section class="content">
            <div class="intro">
                <div class="icon">◷</div>
                <h2>خدمة الشهر</h2>
                <p>خدمة عاملة مقيمة بنظام الشهر</p>
            </div>
            <form>
                <div class="divider">الباقات</div>
                <p class="caption">حدد الباقة المناسبة لك</p>
                <div class="choices select-group"><button class="choice active" type="button">عامل/ة
                        منزلي</button><button class="choice" type="button">مساعدة شخصية</button></div>
                <div class="fields"><select required>
                        <option value="" selected disabled>تحديد الجنسية</option>
                        <option>فلبينية</option>
                        <option>هندية</option>
                        <option>إثيوبية</option>
                    </select><select required>
                        <option value="" selected disabled>حدد مدة الخدمة</option>
                        <option>شهر واحد</option>
                        <option>3 أشهر</option>
                        <option>6 أشهر</option>
                    </select><input type="date" required aria-label="تاريخ بدء الخدمة"></div>
                <div class="actions"><a class="back" href="index.html">رجوع</a><button>استمرار</button></div>
            </form>
        </section>
    </main>
    <script src="booking.js"></script>
</body>

</html>
